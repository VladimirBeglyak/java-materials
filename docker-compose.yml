# Веб-сервер для пособий: стартовая страница index.html + пять папок с курсами.
#
#   Запуск:      docker compose up -d
#   Остановка:   docker compose down
#   Локально:    http://localhost:8090/
#
# Доступ с телефона — через Tailscale Funnel на отдельном порту (443 занят petlife):
#   tailscale funnel --bg --https=10000 http://127.0.0.1:8090
#   -> https://home-pc.tail2595cf.ts.net:10000/
# Закрыть доступ из интернета:
#   tailscale funnel --https=10000 off
# Почему не 8443: Funnel разрешает только порты 443, 8443 и 10000, а 8443 на этой машине
# попадает в зарезервированный Windows диапазон (netsh interface ipv4 show excludedportrange protocol=tcp
# показывает 8360–8459 — динамическое резервирование Hyper-V/WinNAT), и tailscaled не может его занять.
name: visuals

services:
  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:80" # только localhost: наружу порт публикует Tailscale
    volumes:
      - .:/srv/visuals:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
