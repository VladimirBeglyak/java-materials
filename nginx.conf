# Пособия отдаются как статика. TLS снаружи термирует Tailscale Funnel, сюда приходит обычный HTTP.
server {
    listen 80;
    server_name _;
    root /srv/visuals;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Редирект /java-core -> /java-core/ должен быть относительным: nginx не знает,
    # что снаружи https и порт 8443, и с абсолютным адресом увёл бы на http://...:80.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Адрес публичный (Funnel) — просим поисковики не индексировать.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Правки в пособиях должны сразу доходить до телефона: браузер каждый раз сверяет ETag.
    add_header Cache-Control "no-cache";

    location ~ /\. {
        return 404;
    }

    # Наружу — только стартовая страница и пособия. Остальное в папке
    # (.idea, docker-compose.yml, этот конфиг) не отдаём.
    location = / {
    }
    location = /index.html {
    }
    location ~ ^/(java-core|java-concurrency|spring|computer-networks|system-design|relational-db|db-choice|jvm|collections|juc|webflux)(/|$) {
    }
    location / {
        return 404;
    }
}
