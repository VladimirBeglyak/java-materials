/* Стартовая страница: общий вход во все пособия. Цвета и шрифты — те же, что в самих пособиях. */
:root {

  --fg: #1d1f24;
  --fg-muted: #5b5f6a;
  --line: #d9d4c8;
  --accent: #b5501c;
  --ok: #2f7d4f;
  --warn: #9a6b00;

  --t-j: #2f7d4f;
  --t-m: #1f5f99;

  --c-lime: #5b7f14;
  --c-cyan: #0e7490;
  --c-indigo: #4b4fc4;
  --c-amber: #a3620a;
  --c-sql: #336791;
  --c-crypto: #7c3aed;
  --c-rabbit: #ff6600;
  --c-algo: #3b5bdb;
  --radius: 10px;
  --font-sans: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", "Cascadia Code", Consolas, ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171c; --bg-elev: #1d2027; --bg-sunk: #111317; --fg: #e7e4dc; --fg-muted: #9aa0ad;
    --line: #2e323b; --accent: #f08a4b; --ok: #6cc28e; --warn: #e2b44c; --info: #74aee6;
    --t-j: #6cc28e; --t-m: #74aee6; --t-s: #c38ae0; --c-teal: #4fc7bb; --c-rose: #ec7fa0; --c-lime: #a9d65c; --c-cyan: #5ccfe6; --c-indigo: #9a9df5; --c-amber: #f0b45a; --c-sql: #74b0d8; --c-crypto: #a78bfa; --c-rabbit: #ff8a3d; --c-algo: #748ffc;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15171c; --bg-elev: #1d2027; --bg-sunk: #111317; --fg: #e7e4dc; --fg-muted: #9aa0ad;
  --line: #2e323b; --accent: #f08a4b; --ok: #6cc28e; --warn: #e2b44c; --info: #74aee6;
  --t-j: #6cc28e; --t-m: #74aee6; --t-s: #c38ae0; --c-teal: #4fc7bb; --c-rose: #ec7fa0; --c-lime: #a9d65c; --c-cyan: #5ccfe6; --c-indigo: #9a9df5; --c-amber: #f0b45a; --c-sql: #74b0d8; --c-crypto: #a78bfa; --c-rabbit: #ff8a3d; --c-algo: #748ffc;

}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font-sans); font-size: 16.5px; line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 32px; }

/* ---------- Header ---------- */
.page-head { padding: 36px 0 22px; }
.head-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.kicker { font-family: var(--font-mono); font-size: 13px; color: var(--accent); letter-spacing: .05em; }
h1 { font-size: 38px; line-height: 1.15; margin: 8px 0 12px; letter-spacing: -.01em; }
.lead { font-size: 18.5px; color: var(--fg-muted); max-width: 70ch; margin: 0; }
.theme-toggle {
  flex: none; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line);
  background: transparent; color: var(--fg); font: inherit; font-size: 13.5px; cursor: pointer;
}
.theme-toggle:hover { border-color: var(--accent); }

/* ---------- Sticky bar: search + jump to a guide ---------- */
.bar { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); padding: 10px 0; }
.bar .wrap { display: flex; gap: 12px; align-items: center; }
.search {
  flex: 0 1 300px; min-width: 0; font: inherit; font-size: 16px; padding: 8px 12px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--bg-elev); color: var(--fg);
}
.search:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.chips { flex: 1; min-width: 0; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 99px;
  border: 1px solid var(--line); background: var(--bg-elev); color: var(--fg); text-decoration: none;
  font-size: 14px; white-space: nowrap;
}
.chip:hover { border-color: var(--g); }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--g); }
.chip small { font-family: var(--font-mono); font-size: 12px; color: var(--fg-muted); }

/* ---------- Guide card ---------- */
.guide {
  margin: 26px 0; padding: 22px 24px 24px; background: var(--bg-elev); border: 1px solid var(--line);
  border-top: 4px solid var(--g); border-radius: var(--radius); scroll-margin-top: 74px;
}
.g-head { display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 10px 28px; align-items: start; }
.g-brand { font-family: var(--font-mono); font-size: 13px; color: var(--g); letter-spacing: .04em; font-weight: 600; }
.guide h2 { font-size: 25px; line-height: 1.2; margin: 2px 0 6px; }
.g-desc { margin: 0; font-size: 15.5px; color: var(--fg-muted); max-width: 62ch; }
.progress-bar { height: 6px; background: var(--bg-sunk); border-radius: 99px; overflow: hidden; }
.progress-bar > i { display: block; height: 100%; width: 0; background: var(--g); transition: width .4s; }
.progress-label { font-size: 13px; color: var(--fg-muted); margin: 6px 0 10px; }
.g-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn {
  display: inline-flex; align-items: center; min-height: 38px; padding: 6px 14px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--bg); color: var(--fg); text-decoration: none; font-size: 14px;
}
.btn:hover { border-color: var(--g); }
.btn.primary { background: var(--g); border-color: var(--g); color: var(--bg-elev); font-weight: 600; }

.group { font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--fg-muted); margin: 20px 0 6px; }
.topics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 14px; }
.topic {
  display: grid; grid-template-columns: 26px minmax(0, 1fr) auto 16px; gap: 10px; align-items: center;
  min-height: 44px; padding: 8px 10px; border-radius: 8px; border: 1px solid transparent; background: var(--bg);
  color: var(--fg); text-decoration: none; font-size: 15px; line-height: 1.3;
}
.topic:hover { border-color: var(--g); }
.topic .num { font-family: var(--font-mono); font-size: 12.5px; font-weight: 600; color: var(--g); }
.tier { font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 99px; color: var(--bg-elev); }
.tier.j { background: var(--t-j); } .tier.m { background: var(--t-m); } .tier.s { background: var(--t-s); }
.done-mark { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--line); }
.topic.done .done-mark { background: var(--ok); border-color: var(--ok); box-shadow: inset 0 0 0 3px var(--bg); }

.empty { display: none; text-align: center; color: var(--fg-muted); padding: 48px 0; }
.foot { color: var(--fg-muted); font-size: 13.5px; padding: 8px 0 56px; }
[hidden] { display: none !important; }

@media (max-width: 760px) {
  .wrap { padding: 0 16px; }
  .page-head { padding: 22px 0 18px; }
  h1 { font-size: 30px; }
  .lead { font-size: 17px; }
  .bar .wrap { flex-direction: column; align-items: stretch; gap: 8px; }
  .search { flex: none; width: 100%; }
  .guide { padding: 16px 14px 18px; margin: 18px 0; scroll-margin-top: 112px; }
  .g-head { grid-template-columns: minmax(0, 1fr); }
  .guide h2 { font-size: 22px; }
  .topics { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>

<header class="wrap page-head">

    <button class="theme-toggle" type="button">◐ Тема</button>
  </div>
  <h1>Все пособия на одной странице</h1>
  <p class="lead">Выберите пособие или сразу нужную тему. Отметки «изучено» из самих пособий видны и здесь.</p>
</header>

<div class="bar"><div class="wrap">

</div></div>

<main class="wrap">

</main>

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function loadDone(key) { try { return JSON.parse(localStorage.getItem(key) || "{}") || {}; } catch (e) { return {}; } }

  /* ---------- Theme: одна кнопка переключает и эту страницу, и все пособия ---------- */
  function toggleTheme() {
    var cur = document.documentElement.getAttribute("data-theme");
    if (!cur) cur = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    var next = cur === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try {
      localStorage.setItem("hub-theme", next);
      GUIDES.forEach(function (g) { localStorage.setItem(g.theme, next); });
    } catch (e) {}
  }

  /* ---------- Build ---------- */
  function build() {
    var chips = document.querySelector(".chips"), root = document.getElementById("guides"), total = 0;
    GUIDES.forEach(function (g) {
      var color = "var(" + g.color + ")";
      total += g.pages.length;

      var chip = el("a", "chip");
      chip.href = "#" + g.dir; chip.style.setProperty("--g", color);
      chip.appendChild(el("i")); chip.appendChild(el("span", null, g.short));
      g.chipCount = chip.appendChild(el("small"));
      g.chip = chips.appendChild(chip);

      var sec = el("section", "guide");
      sec.id = g.dir; sec.style.setProperty("--g", color);
      var head = el("div", "g-head"), info = el("div"), side = el("div");
      info.appendChild(el("div", "g-brand", g.brand));
      info.appendChild(el("h2", null, g.title));
      info.appendChild(el("p", "g-desc", g.desc));
      var bar = el("div", "progress-bar");
      g.bar = bar.appendChild(el("i"));
      side.appendChild(bar);
      g.label = side.appendChild(el("div", "progress-label"));
      var actions = el("div", "g-actions");
      g.cont = actions.appendChild(el("a", "btn primary"));
      var map = actions.appendChild(el("a", "btn", "Карта курса"));
      map.href = g.dir + "/index.html";
      side.appendChild(actions);
      head.appendChild(info); head.appendChild(side);
      sec.appendChild(head);

      var groupName = null, grid = null;
      g.groups = [];
      g.pages.forEach(function (p) {
        if (p[4] !== groupName) {
          groupName = p[4];
          var box = el("div");
          box.appendChild(el("div", "group", groupName));
          grid = box.appendChild(el("div", "topics"));
          g.groups.push(box);
          sec.appendChild(box);
        }
        var a = el("a", "topic");
        a.href = g.dir + "/" + p[1];
        a.appendChild(el("span", "num", p[0]));
        a.appendChild(el("span", null, p[2]));
        a.appendChild(el("span", "tier " + p[3], TIER[p[3]]));
        var mark = a.appendChild(el("span", "done-mark"));
        mark.title = "изучено";
        p.node = grid.appendChild(a);
      });
      g.node = root.appendChild(sec);
    });
    document.getElementById("kicker").textContent = "УЧЕБНЫЕ ПОСОБИЯ · КУРСОВ: " + GUIDES.length + " · ТЕМ: " + total;
  }

  /* ---------- Progress: читаем отметки, которые ставят сами пособия ---------- */
  function refresh() {
    GUIDES.forEach(function (g) {
      var state = loadDone(g.key), done = 0, next = null;
      g.pages.forEach(function (p) {
        var d = !!state[p[0]];
        p.node.classList.toggle("done", d);
        if (d) done++; else if (!next) next = p;
      });
      g.bar.style.width = Math.round(done / g.pages.length * 100) + "%";
      g.label.textContent = "Изучено " + done + " из " + g.pages.length;
      g.chipCount.textContent = done + "/" + g.pages.length;
      if (next) {
        g.cont.href = g.dir + "/" + next[1];
        g.cont.textContent = done ? "Продолжить с темы " + next[0] + " →" : "Начать с темы " + next[0] + " →";
      } else {
        g.cont.href = g.dir + "/index.html";
        g.cont.textContent = "Пройдено полностью ✓";
      }
    });
  }

  /* ---------- Search ---------- */
  function filter(q) {
    q = q.trim().toLowerCase();
    var any = false;
    GUIDES.forEach(function (g) {
      var whole = !q || (g.title + " " + g.brand + " " + g.short).toLowerCase().indexOf(q) >= 0, shown = 0;
      g.pages.forEach(function (p) {
        var hit = whole || (p[0] + " " + p[2] + " " + p[4]).toLowerCase().indexOf(q) >= 0;
        p.node.hidden = !hit;
        if (hit) shown++;
      });
      g.groups.forEach(function (box) { box.hidden = !box.querySelector(".topic:not([hidden])"); });
      g.node.hidden = !shown;
      g.chip.hidden = !shown;
      if (shown) any = true;
    });
    document.getElementById("empty").style.display = any ? "none" : "block";
  }

  build();
  refresh();
  document.querySelector(".theme-toggle").addEventListener("click", toggleTheme);
  var search = document.querySelector(".search");
  search.addEventListener("input", function () { filter(search.value); });
  search.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    var first = document.querySelector(".topic:not([hidden])");
    if (first && search.value.trim()) location.href = first.href;
  });
  /* При возврате кнопкой «Назад» страница берётся из кэша — обновляем отметки и фильтр. */
  window.addEventListener("pageshow", function () { refresh(); filter(search.value); });
})();
